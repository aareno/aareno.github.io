<article class="project-card">
  <div class="project-image">
    <img src="{{ site.baseurl }}/{{ include.page.image }}" alt="{{ include.page.title }} preview" loading="lazy">
  </div>
  <div class="project-content">
    <h3 class="project-title">{{ include.page.title }}</h3>
    <p class="project-description">{{ include.page.summary }}</p>
    <div class="project-technologies">
      {% for label in include.page.labels limit:3 %}
        <span class="tech-tag">{{ label }}</span>
      {% endfor %}
    </div>
  </div>
  <a href="{{ site.baseurl }}{{ include.page.url }}" class="project-link" aria-label="View {{ include.page.title }} project"></a>
</article>
