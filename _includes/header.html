<header class="portfolio-header">
  <div class="header-container">
    <div class="header-content">
      <a class="logo" href="{{ '/' | prepend: site.baseurl }}" aria-label="{{ site.data.bio.basics.name }} — Home">
        {{ site.data.bio.basics.name }}
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="{{ '/#about' | prepend: site.baseurl }}" class="nav-item">About</a></li>
          <li><a href="{{ '/#projects' | prepend: site.baseurl }}" class="nav-item">Projects</a></li>
          <li><a href="{{ '/#experience' | prepend: site.baseurl }}" class="nav-item">Experience</a></li>
          <li><a href="{{ '/resume.html' | prepend: site.baseurl }}" class="nav-item">Resume</a></li>
        </ul>
      </nav>
    </div>
  </div>
</header>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const header = document.querySelector('.portfolio-header');
    const intro = document.querySelector('.intro');

    function updateHeader() {
      const pastHero = intro && window.scrollY > intro.offsetHeight * 0.7;
      header.classList.toggle('scrolled', !intro || pastHero || window.scrollY > 10);
    }

    updateHeader();
    window.addEventListener('scroll', updateHeader, { passive: true });
  });
</script>
