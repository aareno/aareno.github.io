<article class="essay-card">
  <time datetime="{{ include.page.date | date: '%Y-%m-%d' }}">{{ include.page.date | date: "%b %d, %Y" }}</time>
  <h3>{{ include.page.title }}</h3>
  <p>{{ include.page.content | markdownify | strip_html | truncatewords: 34 }}</p>
  <div class="essay-labels">
    {% for label in include.page.labels %}
      {% if label != "" %}<span class="essay-tag">{{ label }}</span>{% endif %}
    {% endfor %}
  </div>
  <a href="{% if include.page.essayurl %}{{ include.page.essayurl }}{% else %}{{ site.baseurl }}{{ include.page.url }}{% endif %}" class="essay-card-link" aria-label="Read {{ include.page.title }}"></a>
</article>
